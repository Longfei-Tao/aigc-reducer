<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">AIGC Reducer 合成文本改写示意</title>
  <desc id="desc">摘要改写前后并排比较，保留时间、样本、引用和显著性表述，不展示检测分数。</desc>
  <style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}</style>
  <rect width="1200" height="680" rx="18" fill="#F4F6F2" />
  <path d="M18 0H1182Q1200 0 1200 18V146H0V18Q0 0 18 0" fill="#153D37" />
  <text x="42" y="59" font-size="33" fill="#FFFFFF" font-weight="700">AIGC REDUCER</text>
  <text x="42" y="108" font-size="23" fill="#DCEAE1" font-weight="400">改写表达，保留事实。默认只交付 Word。</text>
  <text x="942" y="59" font-size="20" fill="#DCEAE1" font-weight="400">改写示意</text>
  <text x="942" y="100" font-size="20" fill="#DCEAE1" font-weight="400">非检测结果</text>
  <rect x="36" y="172" width="546" height="294" rx="12" fill="#FFFFFF" stroke="#D7DFD7" />
  <text x="60" y="210" font-size="19" fill="#8A5341" font-weight="700">BEFORE · 改写前</text>
  <rect x="618" y="172" width="546" height="294" rx="12" fill="#FFFFFF" stroke="#D7DFD7" />
  <text x="642" y="210" font-size="19" fill="#176B52" font-weight="700">AFTER · 改写后</text>
  <rect x="36" y="488" width="348" height="90" rx="10" fill="#E5EDE5" />
  <text x="56" y="519" font-size="16" fill="#566B60" font-weight="400">字数 · 含空格与标点</text>
  <text x="56" y="555" font-size="23" fill="#153D37" font-weight="700">110 → 108</text>
  <rect x="426" y="488" width="348" height="90" rx="10" fill="#E5EDE5" />
  <text x="446" y="519" font-size="16" fill="#566B60" font-weight="400">句号数量</text>
  <text x="446" y="555" font-size="23" fill="#153D37" font-weight="700">2 → 1</text>
  <rect x="816" y="488" width="348" height="90" rx="10" fill="#E5EDE5" />
  <text x="836" y="519" font-size="16" fill="#566B60" font-weight="400">数值与引用</text>
  <text x="836" y="555" font-size="23" fill="#153D37" font-weight="700">规则检查一致</text>
  <text x="38" y="619" font-size="18" fill="#566B60" font-weight="400">合成文本与编辑示意；未调用检测平台，不能据此推断 AI 率下降。</text>
  <text x="38" y="650" font-size="17" fill="#566B60" font-weight="400">保留 2023—2024 年、186 例、引用 [1] 与效果强度；完整原文见 examples/rewrites.json。</text>
  <text x="60" y="252" font-size="21" fill="#263B3A" font-weight="400">本研究旨在探讨术后早期营养干预对加速康复外科</text>
  <text x="60" y="285" font-size="21" fill="#263B3A" font-weight="400">效果的影响。通过对 2023 年 6 月至 2024 年 5 月</text>
  <text x="60" y="318" font-size="21" fill="#263B3A" font-weight="400">期间收治的 186 例患者进行回顾性分析，我们认为</text>
  <text x="60" y="351" font-size="21" fill="#263B3A" font-weight="400">早期营养干预能够显著提升患者的康复质量，缩短</text>
  <text x="60" y="384" font-size="21" fill="#263B3A" font-weight="400">住院时间 [1]。</text>
  <text x="642" y="252" font-size="21" fill="#263B3A" font-weight="400">本研究主要看术后早期营养干预对加速康复外科效</text>
  <text x="642" y="285" font-size="21" fill="#263B3A" font-weight="400">果有没有影响，对 2023 年 6 月至 2024 年 5 月收</text>
  <text x="642" y="318" font-size="21" fill="#263B3A" font-weight="400">治的 186 例患者做了回顾性分析，结果提示早期营</text>
  <text x="642" y="351" font-size="21" fill="#263B3A" font-weight="400">养干预能显著提升患者的康复质量，也能缩短住院</text>
  <text x="642" y="384" font-size="21" fill="#263B3A" font-weight="400">时间 [1]。</text>
</svg>
